<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="kicker">spacing scale — 4 / 8 / 12 / 16 / 20 / 24 / 32 / 40 / 48 / 64</div>
<div class="col" style="gap:6px">
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-1 4</div><div style="height:8px;width:4px;background:var(--trace)"></div></div>
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-2 8</div><div style="height:8px;width:8px;background:var(--trace)"></div></div>
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-3 12</div><div style="height:8px;width:12px;background:var(--trace)"></div></div>
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-4 16</div><div style="height:8px;width:16px;background:var(--trace)"></div></div>
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-5 20</div><div style="height:8px;width:20px;background:var(--trace)"></div></div>
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-6 24</div><div style="height:8px;width:24px;background:var(--trace)"></div></div>
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-8 32</div><div style="height:8px;width:32px;background:var(--trace)"></div></div>
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-10 40</div><div style="height:8px;width:40px;background:var(--trace)"></div></div>
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-12 48</div><div style="height:8px;width:48px;background:var(--trace)"></div></div>
  <div class="row" style="align-items:center;gap:14px"><div class="detail mono" style="width:64px">space-16 64</div><div style="height:8px;width:64px;background:var(--trace)"></div></div>
</div>
</div></body></html>

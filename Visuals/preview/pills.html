<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="kicker">status pills · canonical chip</div>
<div class="row" style="gap:8px">
  <span class="pill verified">VERIFIED</span>
  <span class="pill active">ACTIVE</span>
  <span class="pill warning">EXPLORATORY</span>
  <span class="pill warning">CANDIDATE</span>
</div>
<div class="row" style="gap:8px">
  <span class="pill failed">FALSIFIED</span>
  <span class="pill failed">FAILED GATE</span>
  <span class="pill motif">MOTIF</span>
  <span class="pill trace">TRACE</span>
</div>
<div class="row" style="gap:8px">
  <span class="pill unavailable">MISSING</span>
  <span class="pill unavailable">PHASE 0</span>
  <span class="pill unavailable">DEGRADED</span>
</div>
<div class="detail" style="color:var(--fg4)">UPPERCASE · mono · letter-spaced. Dot glows in color. Used everywhere status is communicated.</div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="kicker">radii & shadows</div>
<div class="row" style="gap:14px;align-items:flex-end">
  <div class="col"><div style="width:56px;height:56px;background:var(--bg-panel-raised);border:1px solid var(--border);border-radius:3px"></div><div class="detail mono">3 · xs</div></div>
  <div class="col"><div style="width:56px;height:56px;background:var(--bg-panel-raised);border:1px solid var(--border);border-radius:6px"></div><div class="detail mono">6 · sm</div></div>
  <div class="col"><div style="width:56px;height:56px;background:var(--bg-panel-raised);border:1px solid var(--border);border-radius:8px"></div><div class="detail mono">8 · md</div></div>
  <div class="col"><div style="width:56px;height:56px;background:var(--bg-panel-raised);border:1px solid var(--border);border-radius:12px"></div><div class="detail mono">12 · lg</div></div>
  <div class="col"><div style="width:56px;height:24px;background:var(--bg-panel-raised);border:1px solid var(--border);border-radius:999px"></div><div class="detail mono">pill</div></div>
</div>
<div class="row" style="gap:18px;margin-top:8px;align-items:center">
  <div class="col"><div style="width:120px;height:60px;background:var(--bg-panel-raised);border-radius:8px;box-shadow:var(--shadow-card)"></div><div class="detail mono">--shadow-card</div></div>
  <div class="col"><div style="width:120px;height:60px;background:var(--bg-panel-glow);border-radius:8px;box-shadow:var(--shadow-glow-soft)"></div><div class="detail mono">--shadow-glow-soft</div></div>
  <div class="col"><div style="width:120px;height:60px;background:var(--bg-panel-raised);border-radius:8px;box-shadow:var(--verified-glow)"></div><div class="detail mono">--verified-glow</div></div>
  <div class="col"><div style="width:120px;height:60px;background:var(--bg-panel-raised);border-radius:8px;box-shadow:var(--motif-glow)"></div><div class="detail mono">--motif-glow</div></div>
</div>
</div></body></html>

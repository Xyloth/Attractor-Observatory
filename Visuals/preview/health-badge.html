<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="kicker">health badge · 0–100 score</div>
<div class="panel" style="padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:var(--verified-glow)">
  <div style="position:relative;width:96px;height:96px">
    <svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="40" fill="none" stroke="var(--border)" stroke-width="6"/>
      <circle cx="48" cy="48" r="40" fill="none" stroke="var(--verified)" stroke-width="6" stroke-dasharray="218" stroke-dashoffset="32" stroke-linecap="round" transform="rotate(-90 48 48)" style="filter:drop-shadow(0 0 8px var(--verified))"/>
    </svg>
    <div style="position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:var(--fg1);font-size:2rem">87</div>
  </div>
  <div class="col" style="gap:6px">
    <div class="kicker" style="color:var(--verified)">PROJECT HEALTH</div>
    <div style="font-family:var(--font-display);font-weight:600;color:var(--fg1);font-size:1.4rem">Healthy</div>
    <div class="detail mono" style="color:var(--fg4)">9 components · panic budget OK · last update 12s ago</div>
  </div>
</div>
</div></body></html>

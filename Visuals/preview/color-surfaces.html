<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="kicker">surfaces — observatory deep → raised card</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
  <div class="col"><div class="swatch" style="background:var(--bg-deeper)"></div><div class="token-meta"><span class="name">--bg-deeper</span><span class="hex">#060912</span></div></div>
  <div class="col"><div class="swatch" style="background:var(--bg-deep)"></div><div class="token-meta"><span class="name">--bg-deep</span><span class="hex">#0A0E16</span></div></div>
  <div class="col"><div class="swatch" style="background:var(--bg-panel)"></div><div class="token-meta"><span class="name">--bg-panel</span><span class="hex">#121826</span></div></div>
  <div class="col"><div class="swatch" style="background:var(--bg-panel-raised)"></div><div class="token-meta"><span class="name">--bg-panel-raised</span><span class="hex">#1A2032</span></div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
  <div class="col"><div class="swatch" style="background:var(--bg-panel-glow);box-shadow:var(--shadow-glow-soft)"></div><div class="token-meta"><span class="name">--bg-panel-glow</span><span class="hex">#161E34</span></div></div>
  <div class="col"><div class="swatch quarantine" style="border-radius:var(--radius-md)"></div><div class="token-meta"><span class="name">--bg-quarantine</span><span class="hex">#1F1A0D</span></div></div>
  <div class="col"><div class="swatch" style="background:var(--bg-panel);border:1px solid var(--border-strong)"></div><div class="token-meta"><span class="name">--border-strong</span><span class="hex">#3A4560</span></div></div>
  <div class="col"><div class="swatch" style="background:var(--bg-panel);border:1px dashed var(--border-dashed)"></div><div class="token-meta"><span class="name">--border-dashed</span><span class="hex">#4A5266</span></div></div>
</div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="kicker">gate grid · campaigns × gates</div>
<div style="display:grid;grid-template-columns:90px repeat(6,1fr);gap:6px;align-items:center;font-family:var(--font-mono);font-size:.78rem;color:var(--fg4)">
  <div></div><div style="text-align:center">G1</div><div style="text-align:center">G2</div><div style="text-align:center">G3</div><div style="text-align:center">G4</div><div style="text-align:center">G5</div><div style="text-align:center">G6</div>
  <div style="color:var(--fg2)">C002</div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--warning-soft);border:1px solid rgba(245,166,35,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="color:var(--fg2)">C008</div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--failed-soft);border:1px solid rgba(255,84,104,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--warning-soft);border:1px solid rgba(245,166,35,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="color:var(--fg2)">C014</div>
  <div style="height:24px;background:var(--verified-soft);border:1px solid rgba(61,220,132,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--active-soft);border:1px solid rgba(79,195,247,.4);border-radius:4px"></div>
  <div style="height:24px;background:var(--bg-panel);border:1px dashed var(--border-dashed);border-radius:4px"></div>
  <div style="height:24px;background:var(--bg-panel);border:1px dashed var(--border-dashed);border-radius:4px"></div>
  <div style="height:24px;background:var(--bg-panel);border:1px dashed var(--border-dashed);border-radius:4px"></div>
  <div style="height:24px;background:var(--bg-panel);border:1px dashed var(--border-dashed);border-radius:4px"></div>
</div>
<div class="row" style="gap:14px;font-size:.78rem;color:var(--fg4);font-family:var(--font-mono)">
  <span><span style="display:inline-block;width:8px;height:8px;background:var(--verified);border-radius:2px;vertical-align:middle"></span> pass</span>
  <span><span style="display:inline-block;width:8px;height:8px;background:var(--warning);border-radius:2px;vertical-align:middle"></span> review</span>
  <span><span style="display:inline-block;width:8px;height:8px;background:var(--failed);border-radius:2px;vertical-align:middle"></span> fail</span>
  <span><span style="display:inline-block;width:8px;height:8px;background:var(--active);border-radius:2px;vertical-align:middle"></span> active</span>
  <span><span style="display:inline-block;width:8px;height:8px;background:var(--bg-panel);border:1px dashed var(--border-dashed);border-radius:2px;vertical-align:middle"></span> missing</span>
</div>
</div></body></html>
